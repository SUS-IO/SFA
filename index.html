<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFA Bike Rental</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--navy:#102A43;--blue:#1565C0;--pink:#F26A8D;--bg:#F4F7FB;--cyan:#CBEEF3;--line:#d9e2ec}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:#1f2d3d}
.hide{display:none!important}
#login{max-width:340px;margin:12vh auto;background:#fff;padding:28px;border:1px solid var(--line);border-radius:10px}
#login h1{margin:0 0 4px;color:var(--navy);font-size:22px}
label{display:block;font-size:13px;margin:10px 0 3px;color:#486581}
input,select,textarea{width:100%;padding:9px;border:1px solid #bcccdc;border-radius:6px;font:inherit}
button{padding:9px 14px;border:0;border-radius:6px;background:var(--blue);color:#fff;font:inherit;cursor:pointer}
button.alt{background:#fff;color:var(--navy);border:1px solid #bcccdc}button.pink{background:var(--pink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cyan);outline-offset:1px}
#app{display:flex;min-height:100vh}
nav{width:200px;background:var(--navy);color:#fff;padding:16px 10px;flex-shrink:0}
nav b{display:block;padding:6px 10px 14px;font-size:17px}
nav a{display:block;padding:9px 10px;border-radius:6px;color:#cfe0f1;cursor:pointer}
nav a.on{background:var(--blue);color:#fff}
main{flex:1;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
section{padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px}
.card span{font-size:26px;color:var(--navy);font-weight:600;display:block}
.box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#eef3f8;color:#486581;font-weight:600}
.b{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--cyan);color:var(--navy)}
.b.pending{background:#ffe3ec;color:#a3254a}.b.active,.b.available,.b.acknowledged{background:#d8f3dc;color:#1b5e20}
#toast{position:fixed;bottom:16px;right:16px;padding:12px 16px;border-radius:8px;color:#fff;max-width:340px}
@media(max-width:700px){#app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;gap:4px;padding:8px}nav b{display:none}nav a{white-space:nowrap}}
</style></head><body>
<div id="login"><h1>SFA Bike Rental</h1><div style="color:#627d98">Sign in with your employee User ID</div>
<label for="uid">User ID</label><input id="uid" autocomplete="username">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<p><button id="go" style="width:100%">Sign in</button></p></div>

<div id="app" class="hide">
<nav><b>SFA Bikes</b><a data-t="dash" class="on">Dashboard</a><a data-t="veh">Vehicles</a><a data-t="cust">Customers</a><a data-t="prebook">Pre-bookings</a><a data-t="del">Deliveries</a><a data-t="pay">Payments</a><a data-t="adm" id="navadm" class="hide">Admin</a></nav>
<main><header><span id="who"></span><button class="alt" id="out">Log out</button></header>
<section id="dash"></section><section id="veh" class="hide"></section><section id="cust" class="hide"></section><section id="prebook" class="hide"></section>
<section id="del" class="hide"></section><section id="pay" class="hide"></section><section id="adm" class="hide"></section></main></div>
<div id="pwbox" class="hide" style="position:fixed;inset:0;background:rgba(16,42,67,.88);display:flex;align-items:center;justify-content:center;z-index:9"><div class="box" style="width:320px;margin:0"><b>Set a new password</b><p style="color:#486581">Choose a new password before you continue.</p><label for="np">New password (8+ characters)</label><input id="np" type="password" autocomplete="new-password"><label for="np2">Type it again</label><input id="np2" type="password" autocomplete="new-password"><p><button id="npgo">Save password</button></p></div></div>
<div id="toast" class="hide"></div>

<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL.replace(/\/rest\/v1\/?$/, ""), SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr = n => "₹" + Number(n || 0).toLocaleString("en-IN");
const nm = c => c ? (c.full_name || c.name || c.customer_name || c.mobile || c.id) : "";
let me = null, locs = [];
const SIX_H = 6 * 3600 * 1000;

function toast(msg, ok = true) {
  const t = $("toast"); t.textContent = msg; t.style.background = ok ? "#2e7d32" : "#c62828";
  t.classList.remove("hide"); setTimeout(() => t.classList.add("hide"), 4500);
}
let pending = 0;   // saves in progress: all buttons stay locked until the server answers
const lockUI = on => document.querySelectorAll("main button").forEach(b => b.disabled = on);
document.addEventListener("click", e => { if (e.target.closest("main button")) setTimeout(() => { if (pending) lockUI(true); }, 0); });
async function run(p, okMsg) {   // success shown only after server confirms
  if (okMsg) pending++;
  try {
    const { data, error } = await p;
    if (error) { toast(error.code === "23505" ? "This already exists, so it was not saved again" : error.message, false); return null; }
    if (okMsg) toast(okMsg); return data ?? true;
  } finally { if (okMsg && --pending === 0) lockUI(false); }
}

$("go").onclick = async () => {
  const id = $("uid").value.trim().toLowerCase().replace("@sfabike.app", "");
  const { error } = await sb.auth.signInWithPassword({ email: id + "@sfabike.app", password: $("pw").value });
  if (error) return toast(error.message, false);
  localStorage.setItem("sfa_login_at", Date.now());
  boot();
};
$("out").onclick = async () => { await sb.auth.signOut(); localStorage.removeItem("sfa_login_at"); location.reload(); };

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  const at = +localStorage.getItem("sfa_login_at") || 0;
  if (Date.now() - at > SIX_H) { await sb.auth.signOut(); return toast("Session expired. Please sign in again.", false); }
  const { data: p, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (error || !p) { await sb.auth.signOut(); return toast("Profile error: " + (error ? error.message : "no row returned"), false); }
  if (p.is_active === false || p.active === false) { await sb.auth.signOut(); return toast("Your account is inactive", false); }
  me = p; me.uid = session.user.id;
  $("who").textContent = (p.user_name || p.user_id) + " · " + p.role;
  $("login").classList.add("hide"); $("app").classList.remove("hide");
  if (["admin", "superadmin"].includes(p.role)) $("navadm").classList.remove("hide");
  if (p.must_change_password) await forcePw();
  locs = (await run(sb.from("locations").select("*").order("name"))) || [];
  setInterval(async () => { if (Date.now() - (+localStorage.getItem("sfa_login_at")) > SIX_H) { await sb.auth.signOut(); location.reload(); } }, 60000);
  show("dash");
}
function forcePw() {
  return new Promise(done => {
    $("pwbox").classList.remove("hide");
    $("npgo").onclick = async () => {
      const a = $("np").value;
      if (a.length < 8 || a !== $("np2").value) return toast("Use at least 8 characters, typed the same twice", false);
      const { error } = await sb.auth.updateUser({ password: a });
      if (error) return toast(error.message, false);
      if (await run(sb.rpc("mark_password_changed"))) { $("pwbox").classList.add("hide"); toast("Password changed"); done(); }
    };
  });
}
document.querySelectorAll("nav a").forEach(a => a.onclick = () => show(a.dataset.t));
function show(t) {
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.t === t));
  document.querySelectorAll("main section").forEach(s => s.classList.toggle("hide", s.id !== t));
  ({ dash, veh: vehicles, cust: customersPage, prebook, del: deliveries, pay: payments, adm: adminPage })[t]();
}
const isMgr = () => ["manager", "admin", "superadmin"].includes(me.role);
const canApp = () => ["approver", "manager", "admin", "superadmin"].includes(me.role);
const table = (heads, rows) => `<div class="tw"><table><tr>${heads.map(h => `<th>${h}</th>`).join("")}</tr>${rows.join("") || `<tr><td colspan="${heads.length}">Nothing here yet.</td></tr>`}</table></div>`;
const locName = id => esc((locs.find(l => l.id === id) || {}).name || "—");

async function dash() {
  const [v, d, p] = await Promise.all([
    sb.from("vehicles").select("status,location_id").eq("active", true),
    sb.from("deliveries").select("ops_status,expected_return"),
    sb.from("payments").select("ack_status,recipient_id")]);
  const V = v.data || [], D = d.data || [], P = p.data || [], today = new Date().toISOString().slice(0, 10);
  const c = (l, n) => `<div class="card">${l}<span>${n}</span></div>`;
  $("dash").innerHTML = `<div class="cards">` +
    c("Available bikes", V.filter(x => x.status === "available").length) + c("With customers", V.filter(x => x.status === "assigned").length) +
    c("In service", V.filter(x => x.status === "service").length) + c("Active rentals", D.filter(x => x.ops_status === "active").length) +
    c("Overdue rentals", D.filter(x => x.ops_status === "active" && x.expected_return < today).length) +
    c("Deliveries to approve", D.filter(x => x.ops_status === "pending").length) +
    c("Cash awaiting acknowledgement", P.filter(x => x.ack_status === "pending").length) + `</div>
    <div class="box"><b>Available bikes by location</b>${table(["Location", "Bikes"], locs.map(l => `<tr><td>${esc(l.name)}</td><td>${V.filter(x => x.status === "available" && x.location_id === l.id).length}</td></tr>`))}</div>`;
}

async function vehicles() {
  const { data } = await sb.from("vehicles").select("*").order("reg_no");
  const opts = locs.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join("");
  $("veh").innerHTML = (isMgr() ? `<div class="box"><b>Add a bike</b><div class="grid"><div><label>Registration number</label><input id="vr"></div><div><label>Model</label><input id="vm"></div>
    <div><label>Location</label><select id="vl">${opts}</select></div></div><p><button id="vadd">Save bike</button></p></div>` : "") +
    table(["Reg. no", "Model", "Location", "Status"], (data || []).map(v => `<tr><td>${esc(v.reg_no)}</td><td>${esc(v.model)}</td><td>${locName(v.location_id)}</td><td><span class="b ${v.status}">${v.status}</span></td></tr>`));
  if (isMgr()) $("vadd").onclick = async () => {
    if (!$("vr").value.trim()) return toast("Enter the registration number", false);
    if (await run(sb.from("vehicles").insert({ reg_no: $("vr").value.replace(/\s+/g, "").toUpperCase(), model: $("vm").value.trim(), location_id: $("vl").value }), "Bike saved")) vehicles();
  };
}

async function prebook() {
  const { data } = await sb.from("pre_bookings").select("*").order("created_at", { ascending: false }).limit(100);
  $("prebook").innerHTML = `<div class="box"><b>New pre-booking</b><div class="grid"><div><label>Customer name</label><input id="pn"></div><div><label>Mobile (with country code)</label><input id="pm" inputmode="tel"></div>
    <div><label>Expected delivery date</label><input id="pd" type="date"></div><div><label>Preferred bike</label><input id="pb"></div></div>
    <label>Remarks</label><input id="pr"><p><button id="padd">Save pre-booking</button></p></div>` +
    table(["Name", "Mobile", "Expected", "Bike", "Remarks"], (data || []).map(r => `<tr><td>${esc(r.customer_name)}</td><td>${esc(r.mobile)}</td><td>${esc(r.expected_date)}</td><td>${esc(r.preferred_bike)}</td><td>${esc(r.remarks)}</td></tr>`));
  $("padd").onclick = async () => {
    const m = $("pm").value.replace(/[\s-]/g, "");
    if (!$("pn").value.trim() || !/^\+?\d{6,15}$/.test(m)) return toast("Enter a name and a valid mobile number", false);
    if (await run(sb.from("pre_bookings").insert({ customer_name: $("pn").value.trim(), mobile: m, expected_date: $("pd").value || null, preferred_bike: $("pb").value, remarks: $("pr").value, created_by: me.uid }), "Pre-booking saved")) prebook();
  };
}

async function deliveries() {
  const [d, v, c] = await Promise.all([
    sb.from("deliveries").select("*, vehicles(reg_no), customers(*)").order("created_at", { ascending: false }).limit(100),
    sb.from("vehicles").select("id,reg_no,location_id").eq("status", "available").eq("active", true),
    sb.from("customers").select("*").eq("status", "active").limit(500)]);
  const co = (c.data || []).map(x => `<option value="${x.id}">${esc(nm(x))}</option>`).join("");
  const vo = (v.data || []).map(x => `<option value="${x.id}">${esc(x.reg_no)} — ${locName(x.location_id)}</option>`).join("");
  $("del").innerHTML = `<div class="box"><b>New delivery</b> <small>(only approved customers and bikes available at an office are listed)</small><div class="grid">
    <div><label>Customer</label><select id="dc">${co}</select></div><div><label>Bike</label><select id="dv">${vo}</select></div>
    <div><label>Days</label><input id="dd" type="number" min="1" value="1"></div><div><label>Daily rate (₹)</label><input id="dr" type="number" min="0"></div>
    <div><label>Deposit (₹)</label><input id="dp" type="number" min="0" value="0"></div><div><label>Delivery charges (₹)</label><input id="dg" type="number" min="0" value="0"></div>
    <div><label>Starting odometer (km)</label><input id="do" type="number" min="0"></div></div>
    <p id="sum" style="color:#486581"></p><button id="dadd">Save delivery</button></div>` +
    table(["No.", "Customer", "Bike", "Days", "Rent", "Deposit", "Return by", "Status", ""], (d.data || []).map(r => `<tr><td>${esc(r.delivery_no)}</td><td>${esc(nm(r.customers))}</td><td>${esc(r.vehicles?.reg_no)}</td><td>${r.days}</td><td>${inr(r.total_rent)}</td><td>${inr(r.deposit)}</td><td>${esc(r.expected_return)}</td>
      <td><span class="b ${r.ops_status}">${r.ops_status}</span></td><td>${r.ops_status === "pending" && canApp() ? `<button data-a="${r.id}">Approve</button> <button class="pink" data-r="${r.id}">Reject</button>` : ""}</td></tr>`));
  const calc = () => $("sum").textContent = `Rent ${inr($("dd").value * $("dr").value)} + charges ${inr($("dg").value)} = ${inr($("dd").value * $("dr").value + +$("dg").value)} due; deposit ${inr($("dp").value)} held separately.`;
  ["dd", "dr", "dg", "dp"].forEach(i => $(i).oninput = calc); calc();
  $("dadd").onclick = async () => {
    if (!$("dc").value || !$("dv").value || !$("dr").value) return toast("Choose a customer, a bike and enter the daily rate", false);
    if (await run(sb.rpc("create_delivery", { p_customer: $("dc").value, p_vehicle: $("dv").value, p_days: +$("dd").value, p_rate: +$("dr").value, p_deposit: +$("dp").value, p_charges: +$("dg").value, p_odo: $("do").value ? +$("do").value : null }), "Delivery saved and sent for approval")) deliveries();
  };
  document.querySelectorAll("[data-a],[data-r]").forEach(b => b.onclick = async () => {
    const ok = !!b.dataset.a, rem = prompt(ok ? "Approval remarks (optional)" : "Reason for rejecting"); if (rem === null) return;
    if (await run(sb.rpc("decide_delivery", { p_id: b.dataset.a || b.dataset.r, p_approve: ok, p_remarks: rem }), ok ? "Delivery approved" : "Delivery rejected")) deliveries();
  });
}

async function payments() {
  const [p, d, e] = await Promise.all([
    sb.from("payments").select("*, deliveries(delivery_no)").order("created_at", { ascending: false }).limit(100),
    sb.from("deliveries").select("id,delivery_no").in("ops_status", ["pending", "active"]),
    sb.from("profiles").select("*").limit(200)]);
  const nameOf = id => { const x = (e.data || []).find(z => z.id === id); return x ? (x.user_name || x.user_id || "") : "—"; };
  const dopt = (d.data || []).map(x => `<option value="${x.id}">${esc(x.delivery_no)}</option>`).join("");
  const eopt = `<option value="">Me</option>` + (e.data || []).filter(x => x.id !== me.uid).map(x => `<option value="${x.id}">${esc(x.user_name || x.user_id)}</option>`).join("");
  $("pay").innerHTML = `<div class="box"><b>Record a payment</b><div class="grid"><div><label>Delivery</label><select id="yd">${dopt}</select></div>
    <div><label>Type</label><select id="yt"><option value="booking_advance">Booking advance</option><option value="rent">Rent</option><option value="deposit">Deposit</option><option value="extension">Extension</option><option value="refund">Refund</option><option value="other">Other</option></select></div>
    <div><label>Amount (₹)</label><input id="ya" type="number" min="1"></div><div><label>Method</label><select id="ym"><option value="cash">Cash</option><option value="online">Online</option></select></div>
    <div><label>Reference</label><input id="yr"></div><div><label>Cash received by</label><select id="ye">${eopt}</select></div></div>
    <p><button id="yadd">Save payment</button></p></div>` +
    table(["Delivery", "Type", "Amount", "Method", "Received by", "Acknowledgement", ""], (p.data || []).map(r => `<tr><td>${esc(r.deliveries?.delivery_no)}</td><td>${r.pay_type}</td><td>${inr(r.amount)}</td><td>${r.method}</td><td>${esc(nameOf(r.recipient_id || r.recorded_by))}</td>
      <td><span class="b ${r.ack_status}">${r.ack_status.replace("_", " ")}</span></td><td>${r.ack_status === "pending" && r.recipient_id === me.uid ? `<button data-k="${r.id}">Acknowledge</button>` : ""}</td></tr>`));
  let key = crypto.randomUUID();   // same key on retry = no duplicate payment
  $("yadd").onclick = async () => {
    if (!$("yd").value || !(+$("ya").value > 0)) return toast("Choose a delivery and enter an amount", false);
    if (await run(sb.rpc("record_payment", { p_delivery: $("yd").value, p_type: $("yt").value, p_amount: +$("ya").value, p_method: $("ym").value, p_reference: $("yr").value || null, p_recipient: $("ye").value || null, p_key: key }), "Payment saved")) { key = crypto.randomUUID(); payments(); }
  };
  document.querySelectorAll("[data-k]").forEach(b => b.onclick = async () => { if (await run(sb.rpc("acknowledge_payment", { p_id: b.dataset.k }), "Receipt acknowledged")) payments(); });
}
// ===== Customers =====
const PH = [["dl_image1","Driving licence, front"],["dl_image2","Driving licence, back"],["mobile_verification","Mobile verification screenshot"],["aadhar_photo1","Aadhaar, front"],["aadhar_photo2","Aadhaar, back"],["aadhar_otp_proof","Aadhaar OTP proof"],["emergency_verification1","Emergency contact 1 verification"],["customer_image","Customer photo"],["emergency_verification2","Emergency contact 2 verification (only if contact 2 is given)"]];
const enc = (c, q) => new Promise(r => c.toBlob(x => x && x.type === "image/webp" ? r(x) : c.toBlob(r, "image/jpeg", q), "image/webp", q));
async function shrink(file, maxDim = 1280, maxBytes = 180000) {   // small but readable; WebP where the browser can, else JPEG
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  let scale = Math.min(1, maxDim / Math.max(bmp.width, bmp.height)), q = 0.7, blob;
  for (let i = 0; i < 10; i++) {
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    blob = await enc(c, q);
    if (blob.size <= maxBytes) return blob;
    q -= 0.1; if (q < 0.4) { q = 0.6; scale *= 0.85; }
  }
  if (blob.size > 1500000) throw new Error("A photo is too large even after shrinking. Use a smaller photo.");
  return blob;
}
const upCache = new Map(); let cBusy = false;   // cache: a retry never uploads the same photo twice
async function upload(file) {
  if (upCache.has(file)) return upCache.get(file);
  const blob = await shrink(file), path = "customers/" + crypto.randomUUID() + (blob.type === "image/webp" ? ".webp" : ".jpg");
  const { error } = await sb.storage.from("photos").upload(path, blob, { contentType: blob.type });
  if (error) throw new Error("Photo upload failed: " + error.message);
  upCache.set(file, path); return path;
}
async function customersPage() {
  const { data } = await sb.from("customers").select("id,name,mobile,status,created_at").order("created_at", { ascending: false }).limit(200);
  $("cust").innerHTML = `<div class="box"><b>Register a customer</b> <small>(saved as pending until an approver approves)</small>
    <div class="grid"><div><label>Full name</label><input id="cn"></div><div><label>Mobile</label><input id="cm" inputmode="tel"></div><div><label>Second mobile (optional)</label><input id="cm2" inputmode="tel"></div></div>
    <label>Permanent address</label><textarea id="ca" rows="2"></textarea>
    <div class="grid"><div><label>Emergency contact name</label><input id="en"></div><div><label>Relation</label><input id="er1"></div><div><label>Number</label><input id="e1" inputmode="tel"></div>
    <div><label>Second contact relation (optional)</label><input id="er2"></div><div><label>Second contact number</label><input id="e2" inputmode="tel"></div></div>
    <p><b>Photos</b> <small>(shrunk automatically before upload)</small></p><div class="grid">
    ${PH.map(([k, l]) => `<div><label for="f_${k}">${l}</label><input id="f_${k}" type="file" accept="image/*"></div>`).join("")}
    <div><label for="f_add">Additional proofs (up to 5)</label><input id="f_add" type="file" accept="image/*" multiple></div></div>
    <label>Remarks</label><input id="cr"><p><button id="cadd">Save customer</button></p></div><div id="cphotos"></div>` +
    table(["Name", "Mobile", "Status", "Registered", ""], (data || []).map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.mobile)}</td><td><span class="b ${c.status}">${c.status}</span></td><td>${esc(c.created_at.slice(0, 10))}</td>
      <td><button class="alt" data-p="${c.id}">Documents</button> ${c.status === "pending" && canApp() ? `<button data-ap="${c.id}">Approve</button>` : ""}
      ${c.status === "active" && isMgr() ? `<button class="pink" data-bl="${c.id}">Block</button>` : ""}${c.status === "blocked" && isMgr() ? `<button data-ub="${c.id}">Unblock</button>` : ""}</td></tr>`));
  $("cadd").onclick = async () => {
    if (cBusy) return;
    const g = i => $(i).value.trim(), mob = v => v.replace(/[\s\-()]/g, ""), ok = v => /^\+?[0-9]{5,20}$/.test(v);
    const m = mob(g("cm")), m2 = mob(g("cm2")), n1 = mob(g("e1")), n2 = mob(g("e2"));
    if (!g("cn") || !g("ca") || !g("en") || !g("er1")) return toast("Fill in name, address and the first emergency contact", false);
    if (!ok(m) || !ok(n1) || (m2 && !ok(m2)) || (n2 && !ok(n2))) return toast("Mobile numbers need 5 to 20 digits (a leading + is allowed)", false);
    const missing = PH.filter(([k]) => k !== "emergency_verification2" && !$("f_" + k).files[0]);
    if (missing.length) return toast("Add this photo: " + missing[0][1], false);
    if ((g("er2") || n2) && !$("f_emergency_verification2").files[0]) return toast("Add the verification photo for contact 2", false);
    const adds = [...$("f_add").files]; if (adds.length > 5) return toast("At most 5 additional proofs", false);
    cBusy = true; const btn = $("cadd"); btn.disabled = true; btn.textContent = "Uploading photos…";
    try {
      const row = { name: g("cn"), permanent_address: g("ca"), mobile: m, mobile2: m2 || null, emergency_name: g("en"), emergency_relation1: g("er1"), emergency_number1: n1,
        emergency_relation2: g("er2") || null, emergency_number2: n2 || null, additional_proofs: [], remarks: g("cr") || null };
      for (const [k] of PH) { const f = $("f_" + k).files[0]; if (f) row[k] = await upload(f); }
      for (const f of adds) row.additional_proofs.push(await upload(f));
      if (await run(sb.from("customers").insert(row), "Customer saved, waiting for approval")) return customersPage();
    } catch (e) { toast(e.message, false); }
    finally { cBusy = false; if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = "Save customer"; } }
  };
  document.querySelectorAll("[data-ap],[data-bl],[data-ub],[data-p]").forEach(b => b.onclick = async () => {
    if (b.dataset.p) return viewPhotos(b.dataset.p);
    const st = b.dataset.bl ? "blocked" : "active", id = b.dataset.ap || b.dataset.bl || b.dataset.ub;
    if (!confirm(b.dataset.bl ? "Block this customer?" : b.dataset.ub ? "Unblock this customer?" : "Approve this customer?")) return;
    if (await run(sb.from("customers").update({ status: st }).eq("id", id), "Customer updated")) customersPage();
  });
}
async function viewPhotos(id) {
  const { data: c, error } = await sb.from("customers").select("*").eq("id", id).single();
  if (error) return toast(error.message, false);
  const items = [...PH.map(([k, l]) => [l, c[k]]), ...(c.additional_proofs || []).map((p, i) => ["Additional proof " + (i + 1), p])].filter(x => x[1]);
  const { data, error: e2 } = await sb.storage.from("photos").createSignedUrls(items.map(x => x[1]), 120);
  if (e2) return toast("Cannot open documents: " + e2.message, false);
  $("cphotos").innerHTML = `<div class="box"><b>${esc(c.name)}: documents</b> <button class="alt" id="cclose">Close</button><div class="grid" style="margin-top:10px">` +
    data.map((d, i) => `<div><small>${esc(items[i][0])}</small><br>${d.signedUrl ? `<a href="${d.signedUrl}" target="_blank" rel="noopener"><img src="${d.signedUrl}" alt="${esc(items[i][0])}" style="max-width:100%;border-radius:6px"></a>` : "You do not have permission to open this"}</div>`).join("") + `</div></div>`;
  $("cclose").onclick = () => $("cphotos").innerHTML = "";
}
// ===== Admin panel =====
let aTab = "users";
const ROLE_LIST = ["executive", "tele_caller", "approver", "manager", "admin", "superadmin"];
const roleOpts = sel => ROLE_LIST.filter(r => me.role === "superadmin" || r !== "superadmin").map(r => `<option value="${r}" ${r === sel ? "selected" : ""}>${r.replace("_", " ")}</option>`).join("");
function adminCall(body, okMsg) {   // privileged user changes run inside Supabase, never in the browser
  return run((async () => {
    const { data, error } = await sb.functions.invoke("admin-users", { body });
    if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch (_) {} return { error: { message: m } }; }
    return { data: data || true };
  })(), okMsg);
}
async function adminPage() {
  if (!["admin", "superadmin"].includes(me.role)) { $("adm").innerHTML = "Only admins can open this page."; return; }
  const tabs = [["users", "Users"], ["loc", "Locations"], ["hel", "Helmets"], ["aud", "Audit log"]];
  $("adm").innerHTML = `<p>${tabs.map(([k, l]) => `<button class="${aTab === k ? "" : "alt"}" data-at="${k}">${l}</button>`).join(" ")}</p><div id="atab"></div>`;
  document.querySelectorAll("[data-at]").forEach(b => b.onclick = () => { aTab = b.dataset.at; adminPage(); });
  await ({ users: aUsers, loc: aLoc, hel: aHel, aud: aAudit })[aTab]();
}
async function aUsers() {
  const { data } = await sb.from("profiles").select("*").order("user_id");
  $("atab").innerHTML = `<div class="box"><b>Add a user</b> <small>(they must choose their own password at first login)</small><div class="grid">
    <div><label>User ID</label><input id="uu"></div><div><label>Name</label><input id="un"></div><div><label>Role</label><select id="ur">${roleOpts("executive")}</select></div>
    <div><label>Temporary password</label><input id="up"></div></div><p><button id="uadd">Create user</button></p></div>` +
    table(["User ID", "Name", "Role", "Status", "Password", ""], (data || []).map(u => {
      const self = u.id === me.uid, locked = self || (u.role === "superadmin" && me.role !== "superadmin");
      return `<tr><td>${esc(u.user_id)}</td><td>${esc(u.user_name)}</td>
      <td>${locked ? esc(u.role) : `<select data-ro="${u.id}">${roleOpts(u.role)}</select>`}</td>
      <td><span class="b ${u.active ? "active" : "pending"}">${u.active ? "active" : "switched off"}</span></td><td>${u.must_change_password ? "must change" : "set"}</td>
      <td>${locked ? "" : `<button class="alt" data-ac="${u.id}" data-to="${!u.active}">${u.active ? "Switch off" : "Switch on"}</button> <button class="alt" data-rp="${u.id}">Reset password</button>`}</td></tr>`;
    }));
  $("uadd").onclick = async () => {
    const f = i => $(i).value.trim();
    if (!f("uu") || !f("un") || f("up").length < 8) return toast("Enter a User ID, a name and a temporary password of 8+ characters", false);
    if (await adminCall({ action: "create", user_id: f("uu"), user_name: f("un"), role: $("ur").value, password: f("up") }, "User created. Give them the User ID and temporary password.")) aUsers();
  };
  document.querySelectorAll("[data-ro]").forEach(s => s.onchange = async () => { if (await adminCall({ action: "update", id: s.dataset.ro, role: s.value }, "Role changed")) aUsers(); else aUsers(); });
  document.querySelectorAll("[data-ac]").forEach(b => b.onclick = async () => { if (confirm(b.dataset.to === "true" ? "Switch this user on?" : "Switch this user off? They will not be able to sign in.") && await adminCall({ action: "update", id: b.dataset.ac, active: b.dataset.to === "true" }, "User updated")) aUsers(); });
  document.querySelectorAll("[data-rp]").forEach(b => b.onclick = async () => {
    const pw = prompt("Type a temporary password (8+ characters). The user must change it at next login."); if (!pw) return;
    await adminCall({ action: "reset_password", id: b.dataset.rp, password: pw }, "Password reset");
  });
}
async function aLoc() {
  const { data } = await sb.from("locations").select("*").order("name"); locs = data || locs;
  $("atab").innerHTML = `<div class="box"><b>Add a location</b><div class="grid"><div><label>Type</label><select id="lt"><option>Office</option><option>Service Centre</option></select></div>
    <div><label>Name</label><input id="ln"></div></div><p><button id="ladd">Save location</button></p></div>` +
    table(["Name", "Type", "Status", ""], (data || []).map(l => `<tr><td>${esc(l.name)}</td><td>${esc(l.type)}</td><td><span class="b ${l.active ? "active" : "pending"}">${l.active ? "in use" : "switched off"}</span></td>
      <td><button class="alt" data-lc="${l.id}" data-to="${!l.active}">${l.active ? "Switch off" : "Switch on"}</button></td></tr>`));
  $("ladd").onclick = async () => { if (!$("ln").value.trim()) return toast("Enter the location name", false); if (await run(sb.from("locations").insert({ type: $("lt").value, name: $("ln").value.trim() }), "Location saved")) aLoc(); };
  document.querySelectorAll("[data-lc]").forEach(b => b.onclick = async () => { if (await run(sb.from("locations").update({ active: b.dataset.to === "true" }).eq("id", b.dataset.lc), "Location updated")) aLoc(); });
}
async function aHel() {
  const { data } = await sb.from("helmets").select("*").order("tag");
  $("atab").innerHTML = `<div class="box"><b>Add a helmet</b><div class="grid"><div><label>Helmet tag (for example A1)</label><input id="ht"></div>
    <div><label>Location</label><select id="hl">${locs.filter(l => l.active).map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join("")}</select></div></div><p><button id="hadd">Save helmet</button></p></div>` +
    table(["Tag", "Location", "Status"], (data || []).map(h => `<tr><td>${esc(h.tag)}</td><td>${locName(h.location_id)}</td><td><span class="b ${h.status}">${h.status}</span></td></tr>`));
  $("hadd").onclick = async () => { const t = $("ht").value.replace(/\s+/g, "").toUpperCase(); if (!t) return toast("Enter the helmet tag", false); if (await run(sb.from("helmets").insert({ tag: t, location_id: $("hl").value }), "Helmet saved")) aHel(); };
}
async function aAudit() {
  const [a, p] = await Promise.all([sb.from("audit_events").select("*").order("created_at", { ascending: false }).limit(100), sb.from("profiles").select("id,user_id")]);
  const who = id => (p.data || []).find(x => x.id === id)?.user_id || "—";
  $("atab").innerHTML = a.error ? `<div class="box">Audit log needs manager level or higher.</div>` : table(["When", "Who", "What", "Record"], (a.data || []).map(e => `<tr><td>${esc(new Date(e.created_at).toLocaleString("en-IN"))}</td><td>${esc(who(e.actor))}</td><td>${esc(e.action)}</td><td>${esc(e.record_table)}</td></tr>`));
}
boot();
</script></body></html>
